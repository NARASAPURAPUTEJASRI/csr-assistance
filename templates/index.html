<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0f172a, #1e2937); }
    .chat-container { max-height: 70vh; }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="max-w-4xl mx-auto p-4">
    <div class="bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 flex items-center gap-4">
        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-3xl">🤖</div>
        <div>
          <h1 class="text-3xl font-bold">AI Customer Assistant</h1>
          <p class="text-blue-200">• Always here to help</p>
        </div>
      </div>
      <div id="chat" class="chat-container p-6 overflow-y-auto bg-slate-950 h-[70vh] flex flex-col gap-4"></div>
      <div class="p-6 bg-slate-900 border-t border-slate-700">
        <form id="chat-form" class="flex gap-3">
          <input id="user-input" type="text"
                 class="flex-1 bg-slate-800 text-white placeholder-gray-400 rounded-3xl px-6 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                 placeholder="Type your question here... (e.g., status of order 101)">
          <button type="submit"
                  class="bg-blue-600 hover:bg-blue-700 px-8 rounded-3xl font-semibold flex items-center gap-2 transition">
            <i class="fas fa-paper-plane"></i> Send
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
